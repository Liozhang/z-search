<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>z-search</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="chrome://zsearch/content/reactBundle.js"></script>
    <script>
      if (window.parent !== window.self) {
        window.parent.postMessage({ type: "zsearch-hub-ready" }, "*");
      }
      if (typeof ZSearchReact === "undefined") {
        document.getElementById("root").innerHTML =
          '<div style="padding:20px;color:#dc2626;font-family:sans-serif;">' +
          "reactBundle.js failed to execute.</div>";
      }
    </script>
  </body>
</html>
