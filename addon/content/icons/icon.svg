<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="z-search">
  <!--
    z-search 品牌标。

    造型说两件事：深色圆 = 检索范围（文库与外部源一体化入口）兼放大镜镜片，
    Z = 插件身份（与 Zotero 的几何无衬线 Z 同族；加粗与圆角端是 16px 可读
    的图标化取舍，宽体是圆内构图的取舍，并非 Zotero 字形自身的特征），
    绯红柄 = 放大镜手柄，接在镜框右下缘、朝右下 45°。

    2026-09-28 比例微调（上一版观感失衡，病根有三）：
      1. Z 在圆内偏心：旧版圆心 (42,48) 而 Z 墨迹中心 (47,48)，整体右偏 5
         ——Z 右端笔帽与圆边界严丝合缝相切（径向余量 0）、左端径向余量 10，
         白 Z 像被挤到圆的一侧；按包围盒算四边余量 13.5/3.5/14.5/14.5。
      2. 手柄过短：旧版柄心线长 21.9（其中出圆后可见段仅 17.8），而圆直径
         68，柄径比 0.32（经典放大镜取 0.5~0.8），红色小段读起来是个楔子
         而不是柄。
      3. 圆盘过重：直径 68 几乎占满 96 视框，手柄无从伸展，三者比例打架。
    新版把圆盘从「绝对主体」降为「镜片」：直径 68→56，Z 缩到 30×24（心线
    宽高比 1.25，保持宽体 Z 的家族感而不拉伸），柄心线 21.9→38.2（径比
    0.68，45° 整段伸出圆外），三笔统一 8 粗、圆角端。

    几何（96 视框，均为心线/包围盒实测）：
      圆 圆心 (39, 40.5)、半径 28 → 包围盒 x 11..67 / y 12.5..68.5
          （圆心上移左移，给手柄腾出右下象限）
      Z   三笔等粗 8、圆角端，上下横划等长（x 24..54，宽 30），间距 24
          （y 28.5..52.5），对角线 (54,28.5)→(24,52.5)，宽高比 1.25
          Z 墨迹包围盒 x 20..58 / y 24.5..56.5：圆内四边余量（按包围盒）
          左9/右9/上12/下12，左右完全对称（旧版按同口径是 13.5/3.5/14.5/14.5，且右端帽还与圆相切）
      柄  (60.5,59)→(81,79.5)，45°，粗 8、圆角端；帽心距圆心 28.4 恰在
          圆周上，红段自镜框长出，心线长 29.0 = 圆直径的 0.52

    2026-09-29 手柄改接镜框（上一版红帽咬白，病根一处）：
      旧柄起点 (54,52.5) 恰是白底横划右端圆心，红帽与白笔同宽，把白圆头
      整个盖住——两横心线等长、可见长度却 38 对 30，Z 上下不对称；且盘内
      红段对墨底对比不足（约 2.9:1），16px 下不可见，「柄接 Z 角」的意图
      只在制造咬白的大尺寸上存在。新柄起点外移到圆周 (60.5,59)，红段自
      镜框长出，白 Z 完整等长；可见心线 38.2→29.0（径比 0.52，仍在经典
      0.5~0.8 区间）。

    整体光学居中：非透明像素包围盒 x 11..85 / y 12.5..83.5，四边余量
    11/11/12.5/12.5，中心即视框中心 (48,48)——圆自身偏左上，手柄把重心拉回。

    配色沿用墨色 + 绯红双色系。深色宿主场景用 icon-dark.svg（浅圆 + 墨 Z +
    绯红柄）。
  -->
  <circle cx="39" cy="40.5" r="28" fill="#1a1a1a"/>
  <!-- Z：负形白描，三笔一组，圆角端让 16px 下不碎 -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M24 28.5 H54"/>
    <path d="M54 28.5 L24 52.5"/>
    <path d="M24 52.5 H54"/>
  </g>
  <!-- 放大镜手柄：起笔接在镜框右下缘（帽心恰在圆周上），朝右下 45° 伸出 -->
  <path d="M60.5 59 L81 79.5" stroke="#b5343a" stroke-width="8" stroke-linecap="round"/>
</svg>
