<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="z-search">
  <!--
    z-search 品牌标（2026-09-23 重设计）。

    旧标是「圆环 + 实心三角 + 红斜线」的字母双关（OL 字母党），放大镜语义全
    靠猜，48px 下糊成一团。新标用一个造型同时说清两件事：

      深色圆 = 检索范围（文库与外部源的一体化入口）
      Z      = 插件身份，与 Zotero 主标（圆 + Z）同族
      绯红柄 = 放大镜手柄，接在 Z 底横划的右端、朝右下 45°

    几何（96 视框，圆心 42/48，半径 34）：
      Z 三笔等粗 9、圆角端，上下横划等长（x=26..68），对角线 (68,33)→(26,63)。
      圆在 y=33 处右边界 x=72.5、在 y=63 处 x=72.5，故 Z 完全在圆内。
      手柄起笔 (68,63)（藏在 Z 的底横划端头下），出圆点 (70.9,65.9)，收笔
      (84,78)。与 Z 的对角线互为镜像斜率（-45° / +45°），转角处是干净的
      折角，不是两条平行线打架。

      整体光学居中：非透明像素包围盒 x 8..88、y 14..82，中心 (48,48) 与视框
      中心重合，四边余量 8/8/14/14。圆心因此取 (42,48) 而非画布中心——圆自
      身居中而手柄把视觉重心拉向右下，只有把圆往左上让，总重心才回到中心
      （2026-09-23 像素实测：旧版圆心 44/44 时包围盒中心偏到 (50,44)，48px
      下偏出 1px 右 / 2px 上）。

    配色沿用旧标的墨色 + 绯红双色系；旧标的红遮罩三角是旧字母双关的遗物，
    一并去掉。深色宿主场景用 icon-dark.svg（浅圆 + 墨 Z + 绯红柄）。
  -->
  <circle cx="42" cy="48" r="34" fill="#1a1a1a"/>
  <!-- Z：负形白描，三笔一组，圆角端让 16px 下不碎 -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M26 33 H68"/>
    <path d="M68 33 L26 63"/>
    <path d="M26 63 H68"/>
  </g>
  <!-- 放大镜手柄：接在 Z 底横划右端，朝右下 45° -->
  <path d="M68 63 L84 78" stroke="#b5343a" stroke-width="9" stroke-linecap="round"/>
</svg>
