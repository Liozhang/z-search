<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="z-search">
  <!--
    z-search 品牌标。

    造型说两件事：深色圆 = 检索范围（文库与外部源一体化入口）兼放大镜镜片，
    Z = 插件身份（与 Zotero 的几何无衬线 Z 同族；加粗与圆角端是 16px 可读
    的图标化取舍，宽体是圆内构图的取舍，并非 Zotero 字形自身的特征），
    绯红柄 = 放大镜手柄，接在镜框右下缘、朝右下 45°。

    几何（96 视框，均为心线/包围盒实测）：
      圆 圆心 (39.75, 39.75)、半径 28 → 包围盒 11.75..67.75（两轴同）。
          圆心落在主对角线 y=x 上，这是「柄纯径向 + 严格 45° + 墨迹完全
          居中」三个条件同时成立的前提：柄轴与接点径向都压在对角线上，
          四边余量自动相等。
      Z   三笔等粗 7、圆角端。横划心线 x 27.25..52.25（宽 25），间距 20
          （y 29.75 / 49.75），对角线 (52.25,29.75)→(27.25,49.75) 中点恰
          为圆心，宽高比 1.25（宽体家族感不变）。
          Z 墨迹包围盒 x 23.75..55.75 / y 26.25..53.25：圆内四边余量
          （按包围盒）左右 12、上下 14.5；四角帽外缘半径 19.5，角部径向
          间隙 8.5 = 1.2 笔画宽（旧版 4.8 = 0.6 笔画宽）。视线锁定的是
          最紧的角，角部不糊，字母就算站住了。
      柄  (59.55,59.55)→(79.75,79.75)，心线在 y=x 上，粗 9、圆角端。
          起笔帽心距圆心 28.0 恰在圆周上，且轴过圆心——纯径向接管，
          镜框切口是一段垂直于柄轴的弦，两侧肩角对称（旧版轴偏心 2.2、
          偏转 4.3°，切口不对称）。心线长 28.6 = 圆直径的 0.51，在经典
          0.5~0.8 区间内。

    笔画体系 Z 7 / 柄 9，不再是单一粗细：白负形在墨底有光渗、观感偏胖，
    红杆在白底上偏瘦，几何等粗在观感上并不等粗；柄加粗 1 既作感知补偿，
    也把柄的墨量从镜盘的 11% 抬到约 13%，缓解「重镜盘 + 细红杆」的失衡。

    整体光学居中：墨迹包围盒 11.75..84.25（两轴同），四边余量 11.75 全等。

    配色沿用墨色 + 绯红双色系。深色宿主场景用 icon-dark.svg（浅圆 + 墨 Z +
    绯红柄）。

    2026-10-12 三处修正（观感反馈：Z 贴框、柄突兀）：
      1. Z 减重缩位：笔画 8→7，横划 30×24→25×20（比例 1.25 不变），角部
         径向间隙 4.8→8.5。间隙换算 16px 下从 0.8px 到 1.4px，不再与镜框
         糊死；代价是 16px 下字高 4px→3.3px，Z 形最简，仍可读。
      2. 柄改纯径向：旧柄轴 45° 但接点在圆周 40.7° 处，轴心线反向延长偏离
         圆心 2.2（0.27 柄宽）。圆心挪到对角线上（位移 (0.75,-0.75)），
         柄轴即落在 y=x，起笔帽心即 45° 圆周点，接管两侧肩角对称。
      3. 柄加粗 8→9：见上「笔画体系」。心线 29.0→28.6（径比 0.52→0.51）。
      位图 icon-48.png / icon-96.png / icon-dark-48.png 同步重出。

    2026-10-10 红柄垫到镜片下（只调图层，几何零改动）：
      旧版柄画在圆之后，起笔圆帽（帽半径 4，帽心在圆周上）最深处压入圆盘
      约 3.6 单位，红漆在镜框右下缘咬出一块红边——09-29 想要的「红段自镜框
      长出」并没有真正做干净。新版把柄挪到最先绘制、圆盘盖在上面：红段从
      镜框边缘被干净地裁出，红与墨不再叠压。路径坐标、粗细、比例一律不动。

    2026-09-28 比例微调（上一版观感失衡，病根有三）：
      1. Z 在圆内偏心：旧版圆心 (42,48) 而 Z 墨迹中心 (47,48)，整体右偏 5
         ——Z 右端笔帽与圆边界严丝合缝相切（径向余量 0）、左端径向余量 10，
         白 Z 像被挤到圆的一侧；按包围盒算四边余量 13.5/3.5/14.5/14.5。
      2. 手柄过短：旧版柄心线长 21.9（其中出圆后可见段仅 17.8），而圆直径
         68，柄径比 0.32（经典放大镜取 0.5~0.8），红色小段读起来是个楔子
         而不是柄。
      3. 圆盘过重：直径 68 几乎占满 96 视框，手柄无从伸展，三者比例打架。
    新版把圆盘从「绝对主体」降为「镜片」：直径 68→56，Z 缩到 30×24（心线
    宽高比 1.25，保持宽体 Z 的家族感而不拉伸），柄心线 21.9→38.2（径比
    0.68，45° 整段伸出圆外），三笔统一 8 粗、圆角端。

    2026-09-29 手柄改接镜框（上一版红帽咬白，病根一处）：
      旧柄起点 (54,52.5) 恰是白底横划右端圆心，红帽与白笔同宽，把白圆头
      整个盖住——两横心线等长、可见长度却 38 对 30，Z 上下不对称；且盘内
      红段对墨底对比不足（约 2.9:1），16px 下不可见，「柄接 Z 角」的意图
      只在制造咬白的大尺寸上存在。新柄起点外移到圆周 (60.5,59)，红段自
      镜框长出，白 Z 完整等长；可见心线 38.2→29.0（径比 0.52，仍在经典
      0.5~0.8 区间）。
  -->
  <!-- 放大镜手柄：最先绘制，垫在镜片下；起笔帽心恰在 45° 圆周点上，轴过圆心，纯径向伸出 -->
  <path d="M59.55 59.55 L79.75 79.75" stroke="#b5343a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="39.75" cy="39.75" r="28" fill="#1a1a1a"/>
  <!-- Z：负形白描，三笔一组，圆角端让 16px 下不碎 -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M27.25 29.75 H52.25"/>
    <path d="M52.25 29.75 L27.25 49.75"/>
    <path d="M27.25 49.75 H52.25"/>
  </g>
</svg>
