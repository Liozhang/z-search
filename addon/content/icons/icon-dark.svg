<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="z-search">
  <!--
    z-search 标的深色宿主变体。

    与 icon.svg 同构、同几何（2026-09-29 同步微调）：圆心 (39, 40.5)、半径
    28，Z 在 x 24..54 / y 28.5..52.5（粗 8），柄 (60.5,59)→(81,79.5)（粗
    8、45°，起笔改接镜框，见 icon.svg 内注）。只把明度对调：深底场景下墨
    圆会糊进背景，故圆用浅墨 #fafafa、Z 用墨色负形、绯红手柄不变。

    当前仓库内无直接引用点——Zotero 菜单的自定义深色图标机制只在旧工具栏按钮
    上用过。偏好窗（src/modules/prefPaneIcon.ts）按主题切的是栅格化的
    icon-dark-48.png。留作深底场景资产；确认不再需要可直接删。
  -->
  <circle cx="39" cy="40.5" r="28" fill="#fafafa"/>
  <g stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M24 28.5 H54"/>
    <path d="M54 28.5 L24 52.5"/>
    <path d="M24 52.5 H54"/>
  </g>
  <path d="M60.5 59 L81 79.5" stroke="#b5343a" stroke-width="8" stroke-linecap="round"/>
</svg>
