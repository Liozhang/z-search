<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <!-- 主窗工具栏按钮：fill 走 context-fill（CSS -moz-context-properties 注入），
       明暗主题自动跟随 Zotero 工具栏图标色。 -->
  <circle cx="7" cy="7" r="4.25" stroke="context-fill" stroke-width="1.6"/>
  <line x1="10.2" y1="10.2" x2="14" y2="14" stroke="context-fill" stroke-width="1.6" stroke-linecap="round"/>
</svg>
