name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆下仓库里只有当前 tag 和发布提交自身：scaffold 的发布说明
          # 生成器取「上一 tag → 当前 tag」的提交集，唯一提交（发布提交）
          # 又被按提交模板过滤，集合恒空 → Release 说明恒为「No significant
          # changes」（v1.2.3 实证）。全量历史连全部标签一起拉取才能定位
          # 上一 tag 并抽取 CHANGELOG 对应小节。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:prod

      # scaffold CI 模式：版本号已随 tag 提交（本地 npm run release 负责
      # bump + tag + push），这里只创建 v{version} Release 并上传 xpi，
      # 再在 `release` tag 下刷新 update.json 更新清单。
      - run: npx zotero-plugin release -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
